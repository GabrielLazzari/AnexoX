{% extends 'index.html' %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" type="text/css" href="static/css/animacoes.css">
    <link rel="stylesheet" type="text/css" href="static/css/central.css">
    <link rel="stylesheet" type="text/css" href="static/css/usuario.css">
    <link rel="stylesheet" type="text/css" href="static/css/publicacao.css">





</head>

<body>

    {% block conteudo %}
    <style src="static/css/editorjs/columns.css"></style>

    <div id="conteudoLivro" style="display: none;">{{publicacao.conteudo}}</div>

    <style>
        .editorjs-wrapper {
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 0px;
            margin-bottom: 10px;
            box-shadow: 0 6px 18px #e8edfa80;
        }

        .ce-editorjsColumns_col {
            border: 1px solid #eee;
            border-radius: 5px;
            gap: 10px;
            padding-top: 10px;
        }

        .ce-editorjsColumns_col:focus-within {
            box-shadow: 0 6px 18px #e8edfa80;
        }

        /*.cdx-simple-image__caption:has(.hidden) { display: none; }*/
        .cdx-simple-image__caption {
            display: none;
        }

        .ce-toolbar__actions {
            padding: 0;
        }

        .codex-editor__redactor {
            padding-bottom: 0px !important;
        }

        .select-plugin-livro{
            border: 1px solid #eee;
            padding: 5px;
        }

        .ce-toolbar {
            /*left: auto !important;
		right: -10px !important;  ajuste de distância lateral */
        }
    </style>
    <style src="static/css/editorjs/editorjs-fix.css"></style>


    <script src="static/js/editorjs/editorjs.js"></script>
    <script src="static/js/editorjs/delimiter.js"></script>
    <script src="static/js/editorjs/image.js"></script>
    <script src="static/js/editorjs/editorjs-alert.js"></script>
    <script src="static/js/editorjs/editorjs-selecionar-livro.js"></script>
    <script src="static/js/editorjs/header.js"></script>
    <script src="static/js/editorjs/link.js"></script>
    <script src="static/js/editorjs/marker.js"></script>
    <script src="static/js/editorjs/paragraph.js"></script>
    <script src="static/js/editorjs/editorjs-columns.js"></script>
    <script src="static/js/editorjs/list.js"></script>

    <div class="tituloPagina">Criar Publicação</div>

    <div id="criarPublicacaoContainer">
        <div id="criarPublicacaoEditorJs"></div>
    </div>

    <button class="ce-example__button" id="saveButton">
        Salvar
    </button>

    <div id="sobretelaEscolherLivro" class="sobreTela modal">
        <div>
            <div class="tituloBarra">Escolher um livro</div>
            <div id="areaEscolherLivro"></div>
        </div>
    </div>

    <script>

        let tools = {
            header: Header,
            // paragraph : editorjsParagraphLinebreakable,
            paragraph: {
                class: Paragraph,
                inlineToolbar: true,
            },
            livro: {
                class: SelecionarLivro,
                config: {
                    onClick: (data) => {

                    }
                }
            },
            image: {
                class: ImageTool,
                config: {
                    captionPlaceholder: 'Descricao',
                    defaultCaption: '',
                    uploader: {
                        uploadByFile(file) {
                            return new Promise((resolve, reject) => {
                                const reader = new FileReader();
                                reader.onload = () => {
                                    // usamos base64 só para demonstração
                                    resolve({
                                        success: 1,
                                        file: { url: reader.result }
                                    });
                                };
                                reader.onerror = () => reject('Erro ao ler imagem');
                                reader.readAsDataURL(file);
                            });
                        }
                    }
                }
            },
            delimiter: Delimiter,
            marker: Marker,
            alert: Alert,

            columns: {
                class: editorjsColumns,
                config: {
                    tools: {
                        header: Header,
                        alert: Alert,
                        delimiter: Delimiter
                    },
                    EditorJsLibrary: EditorJS
                }
            },
            list: {
                class: EditorjsList,
                inlineToolbar: true,
                config: {
                    defaultStyle: 'unordered'
                },
            }
        }

        var conteudoLivro = document.getElementById("conteudoLivro");
        var dataEditor = {};
        if (conteudoLivro && conteudoLivro.innerText.trim() != ""){
            dataEditor = JSON.parse(conteudoLivro.innerText);
        }

        console.log(dataEditor)

        editor = new EditorJS({
            readOnly: false,
            holder: 'criarPublicacaoEditorJs',
            autofocus: true,
            placeholder: 'Digite aqui seu texto ou adicione uma imagem...',
            tools: tools,
            data: dataEditor, // Imported from example_data.js

            onReady: function () {
                console.log("Delaying Save to launch Column Editors")

                setTimeout(() => {
                    //saveButton.click();
                }, 2000)

            },
            onChange: function (e) {
                console.log(e)
                // console.log('something changed');
            }
        });

        const saveButton = document.getElementById('saveButton');

        saveButton.addEventListener('click', function () {
            editor.save()
                .then((savedData) => {
                    //cPreview.show(savedData, document.getElementById("output"));
                    console.log(savedData)
                    fetch('/criarPublicacao', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            conteudo: savedData,
                        })
                    })
                        .then(response => response.json())
                        .then(retorno => {
                            if (retorno.erro) {
                                toast.erro(retorno.erro);
                            } else {
                                window.location.href = "usuario";
                            }
                        }).catch(error => { console.error('Erro:', error); });
                })
                .catch((error) => {
                    console.error('Saving error', error);
                });
        });

        var objPag = null;

        var areaSelecionarLivro = document.getElementById("areaSelecionarLivro");
        if (areaSelecionarLivro) {
            areaSelecionarLivro.addEventListener("click", function () {
                abrirSobreTela('sobretelaEscolherLivro');
                if (objPag == null) {
                    objPag = new Paginacao("#areaEscolherLivro", {
                        url: '/pesquisaLivros',
                        conteudoHtml: conteudoHtmlLivroPesquisa,
                        mostrarBarraPesquisa: true,
                        clickItem: function (item) {
                            areaSelecionarLivro.innerHTML = item.outerHTML;
                            areaSelecionarLivro.firstChild.className = "livroSelecionadoPublicacao";
                            fecharSobreTela('sobretelaEscolherLivro', true)
                        }
                    });
                }
            })
        }
    </script>

    {% endblock %}
</body>

</html>
